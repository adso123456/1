<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水利运行管理平台 · 小助手嵌入演示</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: #17324d;
        background: #f3f7fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      header {
        height: 68px;
        padding: 0 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #fff;
        background: linear-gradient(105deg, #075f7a, #0a7f82);
      }
      header strong { font-size: 20px; }
      nav { display: flex; gap: 30px; font-size: 14px; }
      main { max-width: 1180px; margin: auto; padding: 34px 24px 64px; }
      .hero {
        padding: 34px;
        border-radius: 18px;
        color: #fff;
        background: linear-gradient(120deg, #087a89, #49a98d);
        box-shadow: 0 18px 40px rgba(16, 100, 113, .16);
      }
      .hero small { opacity: .82; letter-spacing: .1em; }
      .hero h1 { margin: 10px 0 8px; font-size: 32px; }
      .hero p { margin: 0; opacity: .9; }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin-top: 22px;
      }
      .card, .panel {
        padding: 22px;
        border: 1px solid #dce8ee;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(28, 71, 89, .06);
      }
      .card span, .panel small { color: #718795; font-size: 13px; }
      .card strong { display: block; margin: 10px 0 4px; font-size: 27px; }
      .card em { color: #279b72; font-size: 12px; font-style: normal; }
      .content {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 18px;
        margin-top: 18px;
      }
      .panel h2 { margin: 5px 0 20px; font-size: 19px; }
      .river {
        height: 230px;
        border-radius: 12px;
        background:
          radial-gradient(circle at 24% 32%, #2fbaa1 0 5px, transparent 6px),
          radial-gradient(circle at 68% 66%, #f0a52b 0 5px, transparent 6px),
          linear-gradient(150deg, transparent 42%, #78ced4 43% 48%, transparent 49%),
          #edf8f6;
      }
      ul { margin: 0; padding: 0; list-style: none; }
      li { padding: 14px 0; border-top: 1px solid #e8eff2; }
      li:first-child { border-top: 0; }
      li b { display: block; margin-bottom: 4px; font-size: 14px; }
      li span { color: #7b8d98; font-size: 12px; }
      @media (max-width: 760px) {
        nav { display: none; }
        .cards { grid-template-columns: repeat(2, 1fr); }
        .content { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>水利运行管理平台</strong>
      <nav><span>运行总览</span><span>巡查任务</span><span>事件管理</span><span>统计分析</span></nav>
      <span>内网演示环境</span>
    </header>
    <main>
      <section class="hero">
        <small>LAN EMBED DEMO · 192.168.99.25:8081</small>
        <h1>今日水利运行概览</h1>
        <p>点击右下角按钮，体验嵌入到目标网站中的水利数据智能问答小助手。</p>
      </section>
      <section class="cards">
        <article class="card"><span>巡查河段</span><strong>86</strong><em>今日正常</em></article>
        <article class="card"><span>在线监测点</span><strong>128</strong><em>在线率 98.4%</em></article>
        <article class="card"><span>待复核事件</span><strong>5</strong><em>较昨日 -2</em></article>
        <article class="card"><span>本月闭环率</span><strong>96.8%</strong><em>持续提升</em></article>
      </section>
      <section class="content">
        <article class="panel">
          <small>区域态势</small>
          <h2>重点河段监测示意</h2>
          <div class="river" aria-label="河段监测示意图"></div>
        </article>
        <article class="panel">
          <small>最新动态</small>
          <h2>巡查处理进度</h2>
          <ul>
            <li><b>沿江排口例行巡查完成</b><span>10:20 · 已归档</span></li>
            <li><b>重点河段水位复核中</b><span>09:45 · 处理中</span></li>
            <li><b>昨日事件闭环复盘</b><span>08:30 · 已完成</span></li>
          </ul>
        </article>
      </section>
    </main>
    <script
      src="http://192.168.99.25:8080/water-agent-widget.js?v=20260804-bind-source"
      data-agent-url="http://192.168.99.25:5173"
      data-api-url="http://192.168.99.25:8080"
      data-app-id="water-lan-demo"
      defer
    ></script>
  </body>
</html>
